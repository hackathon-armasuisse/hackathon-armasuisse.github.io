title: Armasuisse Hackathon
description: A red-team / blue-team hackathon on building and breaking LLM applications.
remote_theme: just-the-docs/just-the-docs

url: https://hackathon-armasuisse.github.io

# Callout boxes. Usage in a page:
#   {: .warning }
#   > This action is grounds for disqualification.
callouts:
  summary:
    title: Summary
    color: blue
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: yellow
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red

permalink: pretty

# Just the Docs settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/hackathon-armasuisse"

color_scheme: light

footer_content: "Armasuisse Hackathon &middot; September 2026"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - corpus
